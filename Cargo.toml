[package]
name = "bridge-aac"
version = "0.29.0"
edition = "2021"
description = "Beamio Atomic Asset Container reference gateway for Linux"
license = "MIT"
publish = false

[[bin]]
name = "bridge-aac"
path = "src/main.rs"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
blst = "0.3"
ureq = { version = "2", features = ["json"] }
