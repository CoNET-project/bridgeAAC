name: bridgeAAC reproducibility build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          rustup show active-toolchain

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=$(pwd)=/build --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          bin=target/x86_64-unknown-linux-gnu/release/bridge-aac
          file "$bin" | grep -q 'ELF 64-bit'
          echo "commit $(git rev-parse HEAD)"
          sha256sum "$bin"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bridge-aac-repro
          path: target/x86_64-unknown-linux-gnu/release/bridge-aac
